<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Primary Brand Gradient (Teal to Cyan/Blue) -->
    <linearGradient id="azPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="azGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2dd4bf" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#logoBg)" stroke="url(#azPrimary)" stroke-width="2.5" />

  <!-- Inner Soft Accent Ring -->
  <rect x="12" y="12" width="96" height="96" rx="24" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.15" />

  <!-- Monogram Mark: Dynamic Interlocking A & Z -->
  <g filter="url(#azGlow)">
    <!-- Stylized 'A' Left Apex -->
    <path
      d="M36 82 L48 38 L57 38 L67 82 L57 82 L53 64 L43 64 L41 82 Z M45 56 L51 56 L48 44 Z"
      fill="url(#azPrimary)"
    />

    <!-- Stylized 'Z' Shifted & Intersecting -->
    <path
      d="M62 44 L86 44 L86 51 L72 74 L87 74 L87 82 L60 82 L60 75 L74 52 L62 52 Z"
      fill="#ffffff"
      fill-opacity="0.95"
    />

    <!-- Cyan Pulse Accent Dot -->
    <circle cx="86" cy="38" r="3.5" fill="#2dd4bf" />
  </g>
</svg>

